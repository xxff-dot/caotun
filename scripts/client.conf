# caotun 客户端启动配置（start-client.sh 读取，KEY=VALUE 格式）

# 直连地址：灰云域名或 IP:443（必填；CDN 线路见下方 WS）
DIRECT_ADDR=direct.example.com:443

# 认证密码（必填，需与服务端一致）
AUTH_PASSWORD=

# 本地代理监听端口（SOCKS5 + HTTP CONNECT 同端口；所有代理流量走这里）
LOCAL_PORT=21878

# 监听 IP（默认 127.0.0.1 仅本机；局域网共享设 0.0.0.0，注意代理无认证）
#HOST=0.0.0.0

# 系统代理模式：off / pac(白名单分流，Windows/macOS/Linux GNOME) / all(全局)
SYS_PROXY=off

# 走 WebSocket/CDN 传输：1=CDN 线路（需把 DIRECT_ADDR 换成橙云域名:8443），0/留空=直连
#WS=1

# 跳过服务端证书指纹校验：1=开启（不建议，仅调试用）
#INSECURE=1

# PAC 服务端口（SYS_PROXY=pac 时自动起，默认 21879；仅供系统拉取分流脚本，不走流量）
#PAC_PORT=21879

# 面板端口（start-web.sh / start-web.bat 读取；仅绑定 127.0.0.1）
WEB_PORT=21877
