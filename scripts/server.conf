# caotun 服务端配置（与 start-caotun.sh 同目录，KEY=VALUE 格式）
# 认证密码（等效 -auth；填写则每次启动写入 auth 文件，留空沿用现有密码。勿含空格引号）
#AUTH=

# TLS 监听 IP（0.0.0.0=所有网卡；127.0.0.1=仅本机）
HOST=0.0.0.0

# TLS 隧道监听端口
PORT=443

# WebSocket/CDN 接入端口（Cloudflare 免费版可代理的 HTTPS 备用端口；面板管理 API 也在此端口）
WS_PORT=8443

# 正式证书无需在此配置：issue-cert.sh 签发后写入 数据目录/fullchain.pem + privkey.pem，
# 服务端检测到文件变化自动热加载。以下仅在需要指定非默认路径时启用（两个都填才生效）
#CERT=/root/.caotun/other-fullchain.pem

#KEY=/root/.caotun/other-privkey.pem

# 流量配额 GB 与 周期天数（到期自动清零重新计数；MAX_GB=0 不限）
MAX_GB=20

QUOTA_DAYS=30

# 最大并发连接数
MAX_CONNS=100

# 启动时轮换随机密码（1=轮换并写回 /root/.caotun/auth；默认沿用现有密码）
#ROTATE=1
